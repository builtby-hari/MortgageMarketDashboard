<text x="460.0" y="24.0" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Sample Output</text>
<text x="22" y="64" fill="#60a5fa" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">$ python3 cli.py --offline</text>
<text x="22" y="83" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">For the week of October 15, 2026, the 30-year fixed mortgage rate was 7.40% (unchanged on</text>
<text x="22" y="102" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">the week, up 113 bp over 52 weeks); the 15-year was 6.71%. The 10-year Treasury averaged</text>
<text x="22" y="121" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">5.19% over the same week, so the mortgage-Treasury spread was 222 bp (down 3 bp over 52</text>
<text x="22" y="140" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">weeks). That is 0.9 standard deviations above the average of 176 bp (2,899 weekly</text>
<text x="22" y="159" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">observations since 1971), at the 85th percentile of the range 4 to 535 bp. The 10-year</text>
<text x="22" y="178" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">minus 2-year Treasury spread was +38 bp (down 16 bp over 52 weeks); the curve was inverted</text>
<text x="22" y="197" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">on 16% of 12,592 daily readings since 1976. The single-family mortgage delinquency rate</text>
<text x="22" y="216" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">was 1.86% in Q2 2026, down 0.02 pp on the quarter and up 0.08 pp on the year (flat trend),</text>
<text x="22" y="235" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">at the 20th percentile of quarterly readings since 1991.</text>
<text x="22" y="254" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve"></text>
<text x="22" y="273" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">Aligned weeks: 2,899 (1971-04-02 to 2026-10-15)</text>
