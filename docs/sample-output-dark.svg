<line x1="1" x2="919" y1="38" y2="38" stroke="#475569"/>
<circle cx="22" cy="20" r="6" fill="#ef4444"/>
<circle cx="42" cy="20" r="6" fill="#f59e0b"/>
<circle cx="62" cy="20" r="6" fill="#22c55e"/>
<text x="460.0" y="24.0" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Sample Output</text>
<text x="22" y="64" fill="#60a5fa" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">$ python3 cli.py --offline</text>
<text x="22" y="83" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">For the week of October 15, 2026, the 30-year fixed mortgage rate was 7.40% (unchanged on</text>
<text x="22" y="102" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">the week, up 113 bp over 52 weeks); the 15-year was 6.71%. The 10-year Treasury averaged</text>
<text x="22" y="121" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">5.19% over the same week, so the mortgage-Treasury spread was 222 bp (down 2 bp over 52</text>
<text x="22" y="140" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">weeks). That is 0.9 standard deviations above the average of 176 bp (2,899 weekly</text>
<text x="22" y="159" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">observations since 1971), at the 85th percentile of the range 4 to 535 bp. Against the</text>
<text x="22" y="178" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">trailing five years alone it is 0.5 standard deviations below that window's average (the</text>
<text x="22" y="197" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">30th percentile). The 10-year minus 2-year Treasury spread was +33 bp (down 20 bp over 52</text>
<text x="22" y="216" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">weeks); the curve was inverted on 16% of 12,593 daily readings since 1976; it last closed</text>
<text x="22" y="235" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">inverted on September 5, 2024. The 10-year minus 3-month Treasury spread was +86 bp (up 84</text>
<text x="22" y="254" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">bp over 52 weeks); the curve was inverted on 11% of 11,283 daily readings since 1981; it</text>
<text x="22" y="273" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">last closed inverted on October 16, 2025. The single-family mortgage delinquency rate was</text>
<text x="22" y="292" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">1.86% in Q2 2026, down 0.02 pp on the quarter and up 0.08 pp on the year (flat trend), at</text>
<text x="22" y="311" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">the 20th percentile of quarterly readings since 1991.</text>
<text x="22" y="330" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">10Y yield volatility: 5.0 bp std dev of daily changes over the last 63 days</text>
<text x="22" y="349" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve"></text>
<text x="22" y="368" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">Aligned weeks: 2,899 (1971-04-02 to 2026-10-15)</text>
<text x="22" y="387" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">Wrote out/report.html</text>
<text x="22" y="406" fill="#e2e8f0" font-size="13" font-family="Menlo, Consolas, Courier New, monospace" xml:space="preserve">Wrote out/aligned.csv</text>
